[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# Version figée des crates Rust : ne plus la changer. Elle n'apparaît nulle part dans l'app (la version affichée par
# l'iPhone est MARKETING_VERSION dans ios/project.yml). La changer modifie Cargo.lock, ce qui vide le cache de
# compilation de la CI : toutes les dépendances étaient recompilées à chaque nouvelle version.
version = "2.5.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- cœur (même code que les versions Windows et Mac)
dz-api = { path = "crates/dz-api" }
dz-stream = { path = "crates/dz-stream" }
dz-audio = { path = "crates/dz-audio" }
dz-core = { path = "crates/dz-core" }
dz-decrypt = { path = "crates/dz-decrypt" }
dz-offline = { path = "crates/dz-offline" }

# --- déchiffrement
md-5 = "0.10"
blowfish = "0.9"

# --- runtime / réseau
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "http2", "json", "stream", "gzip"] }
reqwest_cookie_store = "0.8"
futures-util = "0.3"
url = "2"

# --- données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- audio
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "aac", "isomp4"] }
cpal = "0.15"
rtrb = "0.3"
rubato = "0.15"
lru = "0.12"

# --- pont iOS
uniffi = "0.29"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
opt-level = 3
# LTO « thin » et compilation en parallèle : le cœur se recompile en quelques dizaines de secondes au lieu de près de
# deux minutes à chaque build (avec « fat » et une seule unité, tout était optimisé d'un bloc, sur un seul cœur du
# processeur). Différence de taille et de vitesse de l'app imperceptible.
lto = "thin"
codegen-units = 16
panic = "abort"
# Les symboles de la bibliothèque statique doivent rester pour l'édition de liens : seules les infos de débogage partent.
strip = "debuginfo"
