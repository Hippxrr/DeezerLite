# Projet Xcode décrit en texte : `xcodegen generate --spec ios/project.yml` crée DeezerLite.xcodeproj (non versionné).
name: DeezerLite
options:
  bundleIdPrefix: com.hippxrr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  DeezerLite:
    type: application
    platform: iOS
    sources:
      - path: DeezerLite
      - path: Generated
    info:
      path: DeezerLite/App/Info.plist
      properties:
        # Nom affiché sous l'icône et dans Réglages > Stockage ; le fichier reste DeezerLite (PRODUCT_NAME).
        CFBundleDisplayName: Deezer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Écran de démarrage d'iOS : le logo centré sur le fond de l'app ; l'app reprend ensuite exactement cette image
        # pour une courte animation (voir `LaunchCover` dans RootView.swift).
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        # Le son continue écran verrouillé.
        UIBackgroundModes: [audio]
        # iPhone ProMotion : les animations de l'app (glissement du mini-lecteur, barre d'onglets, ressorts) peuvent monter
        # à 120 Hz. Sans cette clé, iOS les bloque à 60 Hz (seul le défilement des listes allait à 120 Hz). L'écran
        # redescend tout seul quand rien ne bouge : pas de consommation en plus au repos.
        CADisableMinimumFrameDurationOnPhone: true
        # Partage du récap du mois : « Enregistrer l'image » ajoute la photo (sans ce texte, iOS fermait l'app).
        NSPhotoLibraryAddUsageDescription: "Enregistrer l'image de ton mois dans Photos."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # CarPlay : l'écran de la voiture est une scène à part ; celle du téléphone reste gérée par SwiftUI.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hippxrr.deezerlite
        PRODUCT_NAME: DeezerLite
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        # Icône : Assets.xcassets/AppIcon (le logo de la version bureau).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Icônes au choix dans les réglages : fond blanc, fond noir (cœur violet ou blanc).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-White AppIcon-BlackViolet AppIcon-BlackWhite"
        # Droit CarPlay (audio) : accordé par Apple, il doit aussi figurer dans le profil de signature.
        CODE_SIGN_ENTITLEMENTS: DeezerLite/App/DeezerLite.entitlements
    dependencies:
      # Cœur Rust : bibliothèque statique + en-tête UniFFI, produits par scripts/build-core.sh.
      - framework: ../build/DeezerLiteCore.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CarPlay.framework
      - sdk: CoreAudio.framework
      - sdk: MediaPlayer.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    scheme: {}
